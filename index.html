<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOODLOOP // Cyber Streetwear Collective</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;700&family=Permanent+Marker&family=VT323&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #0a0a0c;
      color: #f3f4f6;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .font-marker {
      font-family: 'Permanent Marker', cursive;
    }
    .bg-grid-pattern {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .holo-text {
      background: linear-gradient(135deg, #00f0ff 0%, #7000ff 30%, #ff007a 60%, #e0e0e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 200%;
      animation: holoShift 6s ease infinite;
    }
    .holo-graphic {
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 25%, #e1bee7 50%, #ff80ab 75%, #b2fef7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 300% 300%;
      animation: holoShift 5s ease infinite;
    }
    @keyframes holoShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0e12;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f0ff;
    }
  </style>
</head>
<body class="bg-grid-pattern antialiased selection:bg-[#00f0ff] selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRODUCTS = [
      {
        id: 'hdlp-pink-script-tee',
        name: 'HDLP Pink Script Heavyweight Tee',
        category: 'tees',
        priceUSD: 9.50,
        pricePHP: 520,
        badge: 'NEW DROP // ₱520',
        isNew: true,
        frontImg: 'hdlp-pink-front',
        backImg: 'hdlp-pink-back',
        description: 'Features the signature pink HDLP script logo printed on the chest and lower body on high-density heavy cotton.',
        specs: ['Heavyweight Cotton Fabric', 'Pink Script HDLP Logo Print', 'Boxy Streetwear Fit', 'Reinforced Collar'],
        sizes: ['S', 'M', 'L', 'XL', 'XXL']
      },
      {
        id: 'hdlp-hood-friends-tee',
        name: 'HDLP "Hood Friends Are Better" Tee',
        category: 'tees',
        priceUSD: 9.50,
        pricePHP: 520,
        badge: 'NEW DROP // ₱520',
        isNew: true,
        frontImg: 'hood-friends-front',
        backImg: 'hood-friends-back',
        description: 'Bold red block typography featuring "HDLP" on the front chest and "HOOD FRIENDS ARE BETTER" back graphic.',
        specs: ['Heavyweight Black Cotton', 'Red & White Block Lettering', 'Front & Back Screenprint', 'Oversized Fit'],
        sizes: ['S', 'M', 'L', 'XL', 'XXL']
      },
      {
        id: 'hdlp-[#00f0ff]-reticle-tee',
        name: 'HDLP Pink Crosshair Target Tee',
        category: 'tees',
        priceUSD: 9.50,
        pricePHP: 520,
        badge: 'NEW DROP // ₱520',
        isNew: true,
        frontImg: 'hdlp-pink-front',
        backImg: 'pink-reticle-back',
        description: 'Black graphic tee featuring pink HDLP script logo on front and a bold pink target reticle graphic on the back.',
        specs: ['100% Premium Cotton', 'Pink Target Reticle Print', 'HDLP Branding Front', 'Streetwear Boxy Fit'],
        sizes: ['S', 'M', 'L', 'XL', 'XXL']
      },
      {
        id: 'hdlp-born-to-die-tee',
        name: 'HDL "Born To Die" Vintage Photo Tee',
        category: 'tees',
        priceUSD: 9.50,
        pricePHP: 520,
        badge: 'NEW DROP // ₱520',
        isNew: true,
        frontImg: 'born-to-die-front',
        backImg: 'blank-black-back',
        description: 'Vintage street aesthetic graphic tee featuring monochrome photo art and gold "Born To Die" script print.',
        specs: ['High-Density Screenprint', 'Monochrome Street Art Graphic', 'Gold Cursive Accents', 'Relaxed Boxy Fit'],
        sizes: ['S', 'M', 'L', 'XL', 'XXL']
      },
      {
        id: 'hdlp-holo-prism-tee',
        name: 'HDL Holographic Diamond Prism Tee',
        category: 'tees',
        priceUSD: 9.50,
        pricePHP: 520,
        badge: 'NEW DROP // ₱520',
        isNew: true,
        frontImg: 'holo-prism-front',
        backImg: 'blank-white-back',
        description: 'Clean white t-shirt centered with a custom iridescent holographic diamond-faceted HDL typographic print.',
        specs: ['Heavy White Cotton Fabric', 'Prismatic Holographic Foil Graphic', 'Structured Cut', 'Branded Lower Tag'],
        sizes: ['S', 'M', 'L', 'XL', 'XXL']
      }
    ];

    function MockupDisplay({ type }) {
      if (type === 'hdlp-pink-front') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-[#09090b] rounded-sm border border-zinc-800 shadow-2xl flex flex-col items-start justify-start p-6 relative">
              <span className="font-sans font-bold text-xl italic tracking-tighter text-[#ff77bc] lowercase mt-4 ml-2">hdlp<span className="text-[8px] align-super">®</span></span>
            </div>
          </div>
        );
      }
      if (type === 'hdlp-pink-back') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-[#09090b] rounded-sm border border-zinc-800 shadow-2xl flex flex-col items-center justify-center p-4 relative">
              <span className="font-sans font-bold text-3xl italic tracking-tighter text-[#ff77bc] lowercase">hdlp<span className="text-xs align-super">®</span></span>
            </div>
          </div>
        );
      }
      if (type === 'hood-friends-front') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-[#09090b] rounded-sm border border-zinc-800 shadow-2xl flex flex-col items-center justify-center p-4 relative">
              <span className="font-orbitron font-black text-3xl tracking-wider text-red-600 drop-shadow-[0_0_2px_#ffffff]">HDLP</span>
            </div>
          </div>
        );
      }
      if (type === 'hood-friends-back') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-[#09090b] rounded-sm border border-zinc-800 shadow-2xl flex flex-col items-center justify-center p-2 text-center leading-none relative">
              <div className="font-orbitron font-black text-2xl text-red-600 drop-shadow-[0_0_2px_#ffffff]">HOOD</div>
              <div className="font-orbitron font-black text-2xl text-red-600 drop-shadow-[0_0_2px_#ffffff]">FRIENDS</div>
              <div className="font-orbitron font-bold text-xs text-red-500 my-0.5">ARE</div>
              <div className="font-orbitron font-black text-2xl text-red-600 drop-shadow-[0_0_2px_#ffffff]">BETTER</div>
            </div>
          </div>
        );
      }
      if (type === 'pink-reticle-back') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-[#09090b] rounded-sm border border-zinc-800 shadow-2xl flex flex-col items-center justify-center p-4 relative">
              <div className="w-24 h-24 border-2 border-[#ff77bc] rounded-full flex items-center justify-center relative">
                <div className="w-12 h-12 border border-[#ff77bc] rounded-full"></div>
                <div className="absolute w-32 h-0.5 bg-[#ff77bc] rotate-45"></div>
                <div className="absolute w-32 h-0.5 bg-[#ff77bc] -rotate-45"></div>
              </div>
            </div>
          </div>
        );
      }
      if (type === 'born-to-die-front') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-[#09090b] rounded-sm border border-zinc-800 shadow-2xl flex flex-col items-center justify-center p-3 relative">
              <div className="w-36 h-36 bg-zinc-800 border border-zinc-700 flex flex-col items-center justify-between p-2 text-center bg-cover bg-center">
                <span className="font-orbitron font-bold text-xs text-white tracking-widest bg-black/60 px-1">HDL</span>
                <span className="font-marker text-xs text-amber-300 italic">Born To Die</span>
              </div>
            </div>
          </div>
        );
      }
      if (type === 'holo-prism-front') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-zinc-100 rounded-sm shadow-2xl flex flex-col items-center justify-center p-4 relative">
              <span className="font-orbitron font-black text-4xl tracking-tight holo-graphic italic">HDL<span className="text-[10px] align-super text-zinc-400">®</span></span>
            </div>
          </div>
        );
      }
      if (type === 'blank-black-back') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-[#09090b] rounded-sm border border-zinc-800 shadow-2xl"></div>
          </div>
        );
      }
      if (type === 'blank-white-back') {
        return (
          <div className="w-full h-full bg-[#18181b] flex flex-col items-center justify-center relative p-4">
            <div className="w-48 h-56 bg-zinc-100 rounded-sm shadow-2xl"></div>
          </div>
        );
      }
      return null;
    }

    function App() {
      const [currency, setCurrency] = useState('PHP');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [viewMode, setViewMode] = useState({});
      const [filterCategory, setFilterCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [checkoutSuccess, setCheckoutSuccess] = useState(false);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const toggleCurrency = () => {
        setCurrency(prev => prev === 'USD' ? 'PHP' : 'USD');
      };

      const formatPrice = (usd, php) => {
        return currency === 'USD' ? `$${usd.toFixed(2)}` : `₱${php.toLocaleString()}`;
      };

      const addToCart = (product, size) => {
        const itemKey = `${product.id}-${size}`;
        setCart(prev => {
          const existing = prev.find(item => item.key === itemKey);
          if (existing) {
            return prev.map(item => item.key === itemKey ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, key: itemKey, selectedSize: size, qty: 1 }];
        });
        setIsCartOpen(true);
      };

      const updateQty = (key, delta) => {
        setCart(prev => prev.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotalUSD = cart.reduce((sum, item) => sum + item.priceUSD * item.qty, 0);
      const cartTotalPHP = cart.reduce((sum, item) => sum + item.pricePHP * item.qty, 0);

      const filteredProducts = PRODUCTS.filter(p => {
        const matchesCategory = filterCategory === 'all' || p.category === filterCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div className="bg-black/90 border-b border-zinc-800 text-xs py-2 px-4 text-center tracking-widest text-zinc-400 font-orbitron uppercase flex justify-between items-center">
            <span className="hidden md:inline">⚡ ALL NEW TEES NOW AVAILABLE AT ₱520</span>
            <span className="mx-auto md:mx-0 text-[#00f0ff]">HOODLOOP PROJECT // NEW DROP LIVE</span>
            <button 
              onClick={toggleCurrency}
              className="px-2 py-0.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 rounded text-[10px] font-mono transition"
            >
              CURRENCY: <span className="text-[#00f0ff] font-bold">{currency}</span>
            </button>
          </div>

          <header className="sticky top-0 z-40 bg-[#0a0a0c]/90 backdrop-blur-md border-b border-zinc-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <a href="#" className="flex items-center gap-2 group">
                <span className="font-orbitron text-2xl font-black tracking-tighter text-white group-hover:text-[#00f0ff] transition">
                  HOODLOOP<span className="text-[#00f0ff]">.</span>
                </span>
                <span className="text-[10px] font-mono uppercase bg-zinc-800 border border-zinc-700 text-zinc-400 px-1.5 py-0.5 rounded">
                  EST. 2026
                </span>
              </a>

              <div className="hidden md:flex items-center relative w-72">
                <input
                  type="text"
                  placeholder="SEARCH CATALOG..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-none py-1.5 pl-8 pr-4 text-xs font-mono text-white placeholder-zinc-500 focus:outline-none focus:border-[#00f0ff]"
                />
                <i data-lucide="search" className="w-4 h-4 text-zinc-500 absolute left-2.5"></i>
              </div>

              <button 
                onClick={() => setIsCartOpen(true)}
                className="relative px-4 py-2 border border-zinc-700 hover:border-[#00f0ff] bg-zinc-900 text-white font-orbitron text-xs tracking-wider flex items-center gap-2 transition group"
              >
                <i data-lucide="shopping-bag" className="w-4 h-4 text-[#00f0ff]"></i>
                <span>CART</span>
                <span className="bg-[#00f0ff] text-black text-[10px] font-bold px-1.5 py-0.2 rounded-full font-mono">
                  {cart.reduce((a, b) => a + b.qty, 0)}
                </span>
              </button>
            </div>
          </header>

          <div className="relative border-b border-zinc-800 overflow-hidden bg-black py-16 px-6 text-center">
            <div className="absolute inset-0 opacity-20 bg-[radial-gradient(#00f0ff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <div className="relative max-w-3xl mx-auto space-y-4">
              <span className="inline-block px-3 py-1 bg-zinc-900 border border-zinc-700 text-[#00f0ff] text-xs font-mono tracking-widest uppercase">
                NEW GRAPHIC COLLECTION // ALL ITEMS ₱520
              </span>
              <h1 className="font-orbitron text-4xl sm:text-6xl font-black tracking-tight text-white uppercase">
                <span className="holo-text">HOODLOOP</span> DROP 2026
              </h1>
              <p className="text-zinc-400 text-sm sm:text-base max-w-xl mx-auto">
                Explore our latest release featuring HDLP pink scripts, holographic prints, hood graphics, and vintage photo tees.
              </p>
            </div>
          </div>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 w-full">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10 pb-6 border-b border-zinc-800">
              <div className="flex flex-wrap gap-2">
                {['all', 'tees'].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setFilterCategory(cat)}
                    className={`px-4 py-1.5 text-xs font-orbitron uppercase tracking-wider border transition ${
                      filterCategory === cat
                        ? 'bg-[#00f0ff] text-black border-[#00f0ff] font-bold'
                        : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-600'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
              <span className="text-xs font-mono text-zinc-500">
                SHOWING {filteredProducts.length} ITEMS
              </span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
              {filteredProducts.map(product => {
                const currentView = viewMode[product.id] || 'front';
                const imageType = currentView === 'front' ? product.frontImg : product.backImg;

                return (
                  <div 
                    key={product.id}
                    className="group bg-zinc-950 border border-zinc-800 hover:border-[#00f0ff]/50 transition flex flex-col justify-between"
                  >
                    <div className="relative aspect-square bg-zinc-900 overflow-hidden">
                      <span className="absolute top-3 left-3 z-10 bg-black/80 backdrop-blur-sm border border-zinc-700 text-[#00f0ff] text-[10px] font-mono px-2 py-1 tracking-wider uppercase">
                        {product.badge}
                      </span>

                      <div className="absolute top-3 right-3 z-10 flex gap-1 bg-black/80 p-1 border border-zinc-800">
                        <button
                          onClick={() => setViewMode({ ...viewMode, [product.id]: 'front' })}
                          className={`px-2 py-0.5 text-[9px] font-mono uppercase transition ${
                            currentView === 'front' ? 'bg-[#00f0ff] text-black font-bold' : 'text-zinc-400 hover:text-white'
                          }`}
                        >
                          FRONT
                        </button>
                        <button
                          onClick={() => setViewMode({ ...viewMode, [product.id]: 'back' })}
                          className={`px-2 py-0.5 text-[9px] font-mono uppercase transition ${
                            currentView === 'back' ? 'bg-[#00f0ff] text-black font-bold' : 'text-zinc-400 hover:text-white'
                          }`}
                        >
                          BACK
                        </button>
                      </div>

                      <MockupDisplay type={imageType} />
                    </div>

                    <div className="p-5 space-y-3 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 className="font-orbitron text-base font-bold text-white group-hover:text-[#00f0ff] transition">
                          {product.name}
                        </h3>
                        <p className="text-xs text-zinc-400 mt-1 line-clamp-2">
                          {product.description}
                        </p>
                      </div>

                      <div className="pt-2 border-t border-zinc-900 flex items-center justify-between">
                        <span className="font-orbitron text-lg font-bold text-white">
                          {formatPrice(product.priceUSD, product.pricePHP)}
                        </span>

                        <div className="flex gap-1">
                          {product.sizes.slice(0, 4).map(size => (
                            <button
                              key={size}
                              onClick={() => addToCart(product, size)}
                              className="w-7 h-7 border border-zinc-800 hover:border-[#00f0ff] hover:bg-[#00f0ff] hover:text-black text-zinc-400 text-[10px] font-mono transition flex items-center justify-center"
                            >
                              {size}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-black/80 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-zinc-950 border-l border-zinc-800 p-6 flex flex-col justify-between h-full">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-zinc-800">
                    <h2 className="font-orbitron text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="shopping-bag" className="text-[#00f0ff] w-5 h-5"></i>
                      BAG ({cart.length})
                    </h2>
                    <button 
                      onClick={() => setIsCartOpen(false)}
                      className="text-zinc-500 hover:text-white p-1"
                    >
                      <i data-lucide="x" className="w-6 h-6"></i>
                    </button>
                  </div>

                  <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-1 mt-4">
                    {cart.length === 0 ? (
                      <div className="text-center py-12 text-zinc-500 font-mono text-xs">
                        YOUR SHOPPING CART IS CURRENTLY EMPTY.
                      </div>
                    ) : (
                      cart.map(item => (
                        <div key={item.key} className="flex gap-4 p-3 bg-zinc-900 border border-zinc-800 items-center">
                          <div className="w-16 h-16 bg-zinc-800 flex-shrink-0 flex items-center justify-center text-xs font-bold font-orbitron text-[#00f0ff]">
                            HDL
                          </div>
                          <div className="flex-1 min-w-0">
                            <h4 className="font-orbitron text-xs font-bold text-white truncate">{item.name}</h4>
                            <p className="text-[10px] font-mono text-zinc-400">SIZE: {item.selectedSize}</p>
                            <p className="text-xs font-bold text-[#00f0ff] mt-1">
                              {formatPrice(item.priceUSD * item.qty, item.pricePHP * item.qty)}
                            </p>
                          </div>
                          <div className="flex items-center border border-zinc-700">
                            <button onClick={() => updateQty(item.key, -1)} className="px-2 py-0.5 text-zinc-400 hover:text-white text-xs">-</button>
                            <span className="px-2 py-0.5 text-xs font-mono bg-zinc-800 text-white">{item.qty}</span>
                            <button onClick={() => updateQty(item.key, 1)} className="px-2 py-0.5 text-zinc-400 hover:text-white text-xs">+</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="pt-4 border-t border-zinc-800 space-y-4">
                  <div className="flex justify-between items-center font-orbitron text-base font-bold text-white">
                    <span>SUBTOTAL</span>
                    <span className="text-[#00f0ff]">{formatPrice(cartTotalUSD, cartTotalPHP)}</span>
                  </div>

                  <button 
                    disabled={cart.length === 0}
                    onClick={() => {
                      setCheckoutSuccess(true);
                      setCart([]);
                    }}
                    className="w-full py-3 bg-[#00f0ff] text-black font-orbitron font-bold text-sm tracking-widest hover:bg-cyan-300 disabled:opacity-50 disabled:cursor-not-allowed transition"
                  >
                    CHECKOUT NOW
                  </button>
                </div>
              </div>
            </div>
          )}

          {checkoutSuccess && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
